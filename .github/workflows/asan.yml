# fork 专用（L0）：上游 .gitignore 忽略 `.*/`，本文件以 git add -f 入库，永不进入上游 PR。
name: ASan Windows

# 控制层测试在 AddressSanitizer 下的运行：windows-2022，Ninja Multi-Config，RelWithDebInfo + /fsanitize=address，
# 链接加 /INCREMENTAL:NO，不带 /RTC（与 ASan 不兼容；RelWithDebInfo 本来就没有）。sccache 的 key 独立于
# build-windows（带 asan 的目标文件不能与普通构建共用）。
# 编译什么：名字里含 Control 的已注册测试（现在是 ControlUnitTests，之后新增的 ControlProcessorTests 等按名字自动纳入，
# 目标由 .github/scripts/list-test-targets.ps1 读自生成的 CTestTestfile.cmake）；运行同样是 `ctest -R Control`
# 的等价物（run-ctest.ps1 -Include Control，每个测试独立的 OPENTUNE_DATA_DIR）。
# 触发：push 到 feature/control-api 且改到控制层、测试、cmake、顶层 CMakeLists.txt 或已声明的钩子文件；
# 手动；PR → feature/** 改到本 workflow 文件自身时（用来在引入它的 PR 上首跑，之后保留，改 asan 流水线的
# PR 同样能在合入前看到结果）。不是必需检查。
on:
  push:
    branches: [feature/control-api]
    paths:
      - 'Source/Control/**'
      - 'Tests/Control/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'Source/PluginProcessor.h'
      - 'Source/PluginProcessor.cpp'
      - 'Source/Utils/AppPreferences.cpp'
      - 'Source/Utils/AppLogger.cpp'
      - 'Source/Content/StandaloneContentRepository.h'
      - 'Source/Content/StandaloneContentRepository.cpp'
      - 'Source/Standalone/PluginEditor.h'
      - 'Source/Standalone/PluginEditor.cpp'
      - 'Source/Utils/UndoManager.h'
      - 'Source/Utils/UndoManager.cpp'
      - 'Source/Editor/OnboardingOverlayComponent.h'
      - 'Source/Editor/OnboardingOverlayComponent.cpp'
      - 'Source/Standalone/UI/ArrangementViewComponent.h'
      - 'Source/Standalone/UI/ArrangementViewComponent.cpp'
      - '.github/workflows/asan.yml'
      - '.github/scripts/list-test-targets.ps1'
      - '.github/scripts/run-ctest.ps1'
  pull_request:
    branches: ['feature/**']
    paths:
      - '.github/workflows/asan.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    name: asan (control tests)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      OT_CONFIG: RelWithDebInfo
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      # lfs: false —— 绝不下载模型权重（CLAUDE.md §11）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Set work paths
        run: |
          @(
            "OT_DEPS=$env:RUNNER_TEMP\ot-deps"
            "OT_BUILD=$env:RUNNER_TEMP\ot-build-asan"
            "OT_TEST_DATA=$env:RUNNER_TEMP\ot-test-data"
            "SCCACHE_DIR=$env:RUNNER_TEMP\sccache"
          ) >> $env:GITHUB_ENV

      # 依赖与 build-windows 同一份缓存 key（同样的锁与解压脚本，内容相同）。
      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.OT_DEPS }}
          key: ot-deps-windows-${{ hashFiles('.github/scripts/deps.lock.json', '.github/scripts/bootstrap-deps.ps1', 'scripts/github_actions/patch-juce-ara.py') }}
      - name: Bootstrap dependencies (sha256 verified), link them into the tree and patch JUCE
        run: |
          pwsh -NoProfile -File .github/scripts/bootstrap-deps.ps1 -DepsRoot $env:OT_DEPS `
            -DownloadsDir "$env:RUNNER_TEMP\ot-deps-downloads" -LinkInto $env:GITHUB_WORKSPACE -PatchJuce
          if ($LASTEXITCODE -ne 0) { throw "bootstrap-deps failed ($LASTEXITCODE)" }
      - name: Save dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.OT_DEPS }}
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # 上游 POST_BUILD 无条件复制声码器与 FCPE 两个模型文件：各放一个 0 字节占位，不下载任何模型（上游已不再跟踪 models\）。
      - name: Model placeholders (0 bytes)
        run: |
          foreach ($rel in 'pc_nsf_hifigan_44.1k_ONNX\pc_nsf_hifigan_44.1k_hop512_128bin_2025.02.onnx', 'models\fcpe.onnx') {
            $placeholder = Join-Path $env:GITHUB_WORKSPACE $rel
            if (Test-Path -LiteralPath $placeholder) { throw "unexpected file at the model path: $placeholder" }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $placeholder) | Out-Null
            New-Item -ItemType File -Path $placeholder | Out-Null
          }

      - name: Fetch sccache (pinned in tools.lock.json)
        id: sccache
        run: |
          $out = node .github/scripts/fetch-tool.mjs sccache --dest "$env:RUNNER_TEMP\ot-tools"
          if ($LASTEXITCODE -ne 0 -or -not $out) { throw "fetch-tool sccache failed ($LASTEXITCODE)" }
          $exe = ([string]($out | Select-Object -Last 1)).Trim()
          "path=$($exe -replace '\\', '/')" >> $env:GITHUB_OUTPUT
      - name: Restore sccache cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ot-sccache-windows-asan-${{ github.sha }}
          restore-keys: |
            ot-sccache-windows-asan-

      - name: Configure (Ninja Multi-Config, RelWithDebInfo, /fsanitize=address, sccache)
        env:
          SCCACHE: ${{ steps.sccache.outputs.path }}
        run: |
          $ninja = (Get-Command ninja -ErrorAction SilentlyContinue)?.Source
          if (-not $ninja) {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            $ninja = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe'
          }
          if (-not (Test-Path -LiteralPath $ninja)) { throw "ninja.exe not found" }
          # /fsanitize=address 通过环境变量 CFLAGS/CXXFLAGS 追加：CMake 把它们与 MSVC 默认的 /DWIN32 /D_WINDOWS /EHsc 合并，
          # 而 -DCMAKE_CXX_FLAGS=... 会整体替换这些默认值。/INCREMENTAL:NO 是 ASan 的链接要求，放在 RelWithDebInfo 的链接参数里
          # （该配置默认带 /INCREMENTAL，放在 CMAKE_EXE_LINKER_FLAGS 会与之冲突）。下一步从 CMakeCache.txt 断言最终结果。
          $env:CFLAGS = '/fsanitize=address'
          $env:CXXFLAGS = '/fsanitize=address'
          # CMP0141=NEW + Embedded（/Z7）让 sccache 可以缓存目标文件，见 build-windows。
          $configure = @(
            'cmake', '-S', $env:GITHUB_WORKSPACE, '-B', $env:OT_BUILD, '-G', 'Ninja Multi-Config',
            "-DCMAKE_MAKE_PROGRAM=$($ninja -replace '\\', '/')",
            "-DCMAKE_CONFIGURATION_TYPES=$env:OT_CONFIG",
            '-DOPENTUNE_BUILD_TESTS=ON',
            '-DOPENTUNE_ENABLE_CONTROL_API=ON',
            '-DCMAKE_EXE_LINKER_FLAGS_RELWITHDEBINFO=/debug /INCREMENTAL:NO',
            '-DCMAKE_SHARED_LINKER_FLAGS_RELWITHDEBINFO=/debug /INCREMENTAL:NO',
            "-DCMAKE_C_COMPILER_LAUNCHER=$env:SCCACHE",
            "-DCMAKE_CXX_COMPILER_LAUNCHER=$env:SCCACHE",
            '-DCMAKE_POLICY_DEFAULT_CMP0141=NEW',
            '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded'
          )
          pwsh -NoProfile -File .github/scripts/with-build-slot.ps1 -VsDevShell -MinFreeMB 2048 -WaitMinutes 10 -- @configure
          if ($LASTEXITCODE -ne 0) { throw "configure failed ($LASTEXITCODE)" }

      # 只读检查：编译参数没有丢掉 MSVC 默认的 /EHsc，ASan 开关在，链接参数是 /INCREMENTAL:NO 而不是 /INCREMENTAL。
      - name: Assert the final compiler and linker flags
        run: |
          $cache = Get-Content -LiteralPath (Join-Path $env:OT_BUILD 'CMakeCache.txt')
          function Get-CacheValue([string]$name) {
            $line = $cache | Where-Object { $_ -match "^$([regex]::Escape($name)):[A-Z]+=" } | Select-Object -First 1
            if (-not $line) { throw "$name not found in CMakeCache.txt" }
            return ($line -replace '^[^=]*=', '')
          }
          $cxx = (Get-CacheValue 'CMAKE_CXX_FLAGS') + ' ' + (Get-CacheValue 'CMAKE_CXX_FLAGS_RELWITHDEBINFO')
          Write-Host "CXX flags: $cxx"
          foreach ($need in '/EHsc', '/fsanitize=address') {
            if ($cxx -notmatch [regex]::Escape($need)) { throw "CMAKE_CXX_FLAGS lacks $need" }
          }
          foreach ($n in 'CMAKE_EXE_LINKER_FLAGS_RELWITHDEBINFO', 'CMAKE_SHARED_LINKER_FLAGS_RELWITHDEBINFO') {
            $v = Get-CacheValue $n
            Write-Host "$n = $v"
            if ($v -notmatch '/INCREMENTAL:NO') { throw "$n lacks /INCREMENTAL:NO" }
            if ($v -match '/INCREMENTAL(?!:NO)') { throw "$n contains a bare /INCREMENTAL" }
          }

      - name: Build the Control tests
        id: build
        run: |
          $targets = @(pwsh -NoProfile -File .github/scripts/list-test-targets.ps1 -BuildDir $env:OT_BUILD -Include Control)
          if ($LASTEXITCODE -ne 0 -or $targets.Count -eq 0) { throw 'no Control test targets' }
          $jobs = [Environment]::ProcessorCount
          Write-Host "targets ($($targets.Count)): $($targets -join ', '); --parallel $jobs"
          $build = @('cmake', '--build', $env:OT_BUILD, '--config', $env:OT_CONFIG, '--parallel', "$jobs", '--target') + $targets
          pwsh -NoProfile -File .github/scripts/with-build-slot.ps1 -VsDevShell -MinFreeMB 2048 -WaitMinutes 10 -- @build
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }

      # 等价于 `ctest -C RelWithDebInfo -R Control --output-on-failure`，每个测试独立的 OPENTUNE_DATA_DIR。
      # 在 VS 开发者环境里运行，ASan 运行库 DLL（clang_rt.asan_dynamic-x86_64.dll）才在 PATH 上。
      - name: ctest -R Control (ASan runtime)
        id: ctest
        run: |
          $summary = "$env:RUNNER_TEMP\ot-ctest-summary.json"
          pwsh -NoProfile -File .github/scripts/with-build-slot.ps1 -VsDevShell -MinFreeMB 1024 -WaitMinutes 10 -- `
            pwsh -NoProfile -File .github/scripts/run-ctest.ps1 -BuildDir $env:OT_BUILD -Config $env:OT_CONFIG `
            -Include Control -Exclude none -DataRoot $env:OT_TEST_DATA -SummaryPath $summary
          $code = $LASTEXITCODE
          if (Test-Path -LiteralPath $summary) {
            $s = Get-Content -LiteralPath $summary -Raw | ConvertFrom-Json
            $lines = @('### ASan：ctest -R Control', '', "$($s.passed)/$($s.total) 通过；$($s.seconds) s", '', '| 测试 | 结果 | 秒 |', '|---|---|---|')
            foreach ($t in @($s.tests)) { $lines += "| $($t.name) | $(if ($t.passed) { 'PASS' } else { 'FAIL' }) | $($t.seconds) |" }
            $lines -join "`n" >> $env:GITHUB_STEP_SUMMARY
            foreach ($name in @($s.failed)) {
              Write-Host "::group::$name output"
              Get-Content -LiteralPath (Join-Path $env:OT_TEST_DATA "$name.log") -ErrorAction SilentlyContinue | Write-Host
              Write-Host '::endgroup::'
            }
          }
          if ($code -ne 0) { throw "ctest failed ($code)" }

      - name: sccache statistics
        if: ${{ always() && steps.sccache.outputs.path != '' }}
        env:
          SCCACHE: ${{ steps.sccache.outputs.path }}
        run: |
          & $env:SCCACHE --show-stats
          & $env:SCCACHE --stop-server
          exit 0
      # 只在 push 时保存：PR 与手动运行只恢复。
      - name: Save sccache cache
        if: ${{ always() && github.event_name == 'push' && steps.sccache.outputs.path != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ot-sccache-windows-asan-${{ github.sha }}
