# fork 专用（L0）：上游 .gitignore 忽略 `.*/`，本文件以 git add -f 入库，永不进入上游 PR。
name: Build Windows

# Windows 编译与测试：windows-2022，Ninja Multi-Config + RelWithDebInfo，sccache，依赖由
# .github/scripts/bootstrap-deps.ps1 按 deps.lock.json 拉取并逐个校验 sha256（绝不下载模型）。
# 编译什么由 detect-native 决定（实现见 .github/scripts/detect-native.mjs）：
#   PR → dev                完整编译与测试（控制接口选项 ON）
#   PR → feature/**         只有 PR 改到原生代码（Source/**、Tests/**、cmake/**、CMakeLists.txt）或构建
#                           流水线本身才编译；否则不编译，聚合 job 给出一个跳过的成功结果
#   PR → review-base/**     选项 ON 与 OFF 各编译、测试一次
#   push → dev、feature/control-api；workflow_dispatch    完整编译与测试
#   workflow_call           被调用时 github.event_name / base_ref 是调用方的事件，不会是 workflow_call。
#                           所以由输入 `full`（默认 true）显式决定：true 完整编译与测试；false 则继承调用方的
#                           事件与 base 分支按上面的分档决定
# 出包模式（workflow_call 输入 release-package: true，由 prerelease.yml 调用）：只构建 Standalone 的 Release（LTCG），
# 控制接口选项 ON，不构建、不运行测试，不用 sccache（发布用的二进制不经缓存）；删除 models\ 后用
# release-notices.mjs 按产物实际内容生成 THIRD-PARTY-NOTICES.txt 与 build-info.json，再把打包输入按白名单
# 上传为 artifact opentune-windows-release-inputs（3 天）。打包、校验与发布在 prerelease.yml。
# 聚合 job `build-windows` 是稳定的检查上下文（将来设为 dev 的必需检查）：不加 paths 过滤、不改名。
# 外部 fork 发来的 PR 同样运行（只读 token、无 secrets）；任何 workflow 一律不用 pull_request 的 target 变体
# （CLAUDE.md §0 第 4 条）。
on:
  pull_request:
    branches: [dev, 'feature/**', 'review-base/**']
  push:
    branches: [dev, feature/control-api]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: 'true（默认）：无论调用方是什么事件都完整编译与测试；false：继承调用方的事件与 base 分支分档'
        type: boolean
        default: true
      release-package:
        description: 'true：出包模式（Standalone Release、控制接口 ON、不跑测试），上传打包输入；默认 false'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 含 github.workflow：被调用时它是调用方的 workflow 名，调用与自身触发的两次运行不会互相取消。
  group: build-windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-native:
    name: detect-native
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      variants: ${{ steps.decide.outputs.variants }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      # lfs: false —— 绝不下载模型权重（CLAUDE.md §11）。fetch-depth: 0 以便计算 PR 的改动范围。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Decide what to build
        id: decide
        env:
          # 被调用且 inputs.full 为 true 时显式传 workflow_call（完整编译）；其余情况用实际事件。
          EVENT_NAME: ${{ inputs.full == true && 'workflow_call' || github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          node .github/scripts/detect-native.mjs --event "$EVENT_NAME" --base "$BASE_REF" --github-output "$GITHUB_OUTPUT"

  compile-test:
    name: compile-test (control-api ${{ matrix.control-api }})
    needs: detect-native
    if: needs.detect-native.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        control-api: ${{ fromJSON(needs.detect-native.outputs.variants) }}
    defaults:
      run:
        shell: pwsh
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      # 出包模式只在被 prerelease.yml 以 release-package: true 调用时打开；其他触发方式下 inputs 为空，值为 false。
      OT_PACKAGE: ${{ inputs.release-package == true && 'true' || 'false' }}
      OT_CONFIG: ${{ inputs.release-package == true && 'Release' || 'RelWithDebInfo' }}
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # 工作目录都在 RUNNER_TEMP 下（job 级 env 里取不到 runner 上下文，所以在这里写入 GITHUB_ENV）。
      - name: Set work paths
        run: |
          @(
            "OT_DEPS=$env:RUNNER_TEMP\ot-deps"
            "OT_BUILD=$env:RUNNER_TEMP\ot-build"
            "OT_TEST_DATA=$env:RUNNER_TEMP\ot-test-data"
            "OT_STAGE=$env:RUNNER_TEMP\ot-stage"
            "SCCACHE_DIR=$env:RUNNER_TEMP\sccache"
          ) >> $env:GITHUB_ENV

      # 依赖缓存只放解压后的依赖目录（下载的归档放在缓存目录之外）；key 含 deps.lock.json 与
      # bootstrap-deps.ps1 的 sha256（解压逻辑变了，旧缓存树不再复用）。命中缓存时 bootstrap-deps 核对每个
      # 依赖的戳记与校验路径；git 依赖另用 git rev-parse HEAD 核对固定的 commit。
      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.OT_DEPS }}
          key: ot-deps-windows-${{ hashFiles('.github/scripts/deps.lock.json', '.github/scripts/bootstrap-deps.ps1', 'scripts/github_actions/patch-juce-ara.py') }}
      - name: Bootstrap dependencies (sha256 verified), link them into the tree and patch JUCE
        run: |
          pwsh -NoProfile -File .github/scripts/bootstrap-deps.ps1 -DepsRoot $env:OT_DEPS `
            -DownloadsDir "$env:RUNNER_TEMP\ot-deps-downloads" -LinkInto $env:GITHUB_WORKSPACE -PatchJuce
          if ($LASTEXITCODE -ne 0) { throw "bootstrap-deps failed ($LASTEXITCODE)" }
      - name: Save dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.OT_DEPS }}
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # 上游 POST_BUILD 无条件复制声码器与 FCPE 两个模型文件：各放一个 0 字节占位，不下载任何模型（两条路径都在上游
      # gitignore 里，上游已不再跟踪 models\）。
      - name: Model placeholders (0 bytes)
        run: |
          foreach ($rel in 'pc_nsf_hifigan_44.1k_ONNX\pc_nsf_hifigan_44.1k_hop512_128bin_2025.02.onnx', 'models\fcpe.onnx') {
            $placeholder = Join-Path $env:GITHUB_WORKSPACE $rel
            if (Test-Path -LiteralPath $placeholder) { throw "unexpected file at the model path: $placeholder" }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $placeholder) | Out-Null
            New-Item -ItemType File -Path $placeholder | Out-Null
          }

      # sccache 的版本与 sha256 锁在 .github/scripts/tools.lock.json，由 fetch-tool.mjs 下载并校验。
      # 出包模式不用 sccache：发布用的二进制从头编译。
      - name: Fetch sccache (pinned in tools.lock.json)
        id: sccache
        if: env.OT_PACKAGE != 'true'
        run: |
          $out = node .github/scripts/fetch-tool.mjs sccache --dest "$env:RUNNER_TEMP\ot-tools"
          if ($LASTEXITCODE -ne 0 -or -not $out) { throw "fetch-tool sccache failed ($LASTEXITCODE)" }
          $exe = ([string]($out | Select-Object -Last 1)).Trim()
          "path=$($exe -replace '\\', '/')" >> $env:GITHUB_OUTPUT
      - name: Restore sccache cache
        if: env.OT_PACKAGE != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ot-sccache-windows-rwdi-${{ matrix.control-api }}-${{ github.sha }}
          restore-keys: |
            ot-sccache-windows-rwdi-${{ matrix.control-api }}-

      # configure / build / ctest 都经 with-build-slot.ps1 -VsDevShell（导入 MSVC 环境；runner 上构建槽只有本 job）。
      - name: Configure (Ninja Multi-Config, RelWithDebInfo, sccache)
        env:
          SCCACHE: ${{ steps.sccache.outputs.path }}
          CONTROL_API: ${{ matrix.control-api }}
        run: |
          $ninja = (Get-Command ninja -ErrorAction SilentlyContinue)?.Source
          if (-not $ninja) {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            $ninja = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe'
          }
          if (-not (Test-Path -LiteralPath $ninja)) { throw "ninja.exe not found" }
          $configure = @(
            'cmake', '-S', $env:GITHUB_WORKSPACE, '-B', $env:OT_BUILD, '-G', 'Ninja Multi-Config',
            "-DCMAKE_MAKE_PROGRAM=$($ninja -replace '\\', '/')",
            "-DCMAKE_CONFIGURATION_TYPES=$env:OT_CONFIG"
          )
          if ($env:OT_PACKAGE -eq 'true') {
            # 出包：只要 Standalone，控制接口必须 ON；不注册测试，不用编译器缓存。
            if ($env:CONTROL_API -ne 'ON') { throw "release-package mode needs the control API option ON (got $env:CONTROL_API)" }
            $configure += @('-DOPENTUNE_BUILD_TESTS=OFF', '-DOPENTUNE_ENABLE_CONTROL_API=ON')
          } else {
            # sccache 只能缓存 /Z7 目标文件：CMP0141=NEW 让 CMAKE_MSVC_DEBUG_INFORMATION_FORMAT 生效
            # （上游声明 cmake_minimum_required(3.22)，不设的话 RelWithDebInfo 用 /Zi）。
            $configure += @(
              '-DOPENTUNE_BUILD_TESTS=ON',
              "-DOPENTUNE_ENABLE_CONTROL_API=$env:CONTROL_API",
              "-DCMAKE_C_COMPILER_LAUNCHER=$env:SCCACHE",
              "-DCMAKE_CXX_COMPILER_LAUNCHER=$env:SCCACHE",
              '-DCMAKE_POLICY_DEFAULT_CMP0141=NEW',
              '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded'
            )
          }
          # 记录实际执行的命令（路径换成占位符），出包模式写进发布说明的「精确构建命令」。
          ConvertTo-Json -Compress -InputObject @($configure | ForEach-Object {
            ([string]$_).Replace($env:GITHUB_WORKSPACE, '<src>').Replace($env:OT_BUILD, '<build>').Replace(($ninja -replace '\\', '/'), '<ninja.exe>')
          }) | Set-Content -LiteralPath "$env:RUNNER_TEMP\ot-cmd-configure.json" -Encoding utf8
          pwsh -NoProfile -File .github/scripts/with-build-slot.ps1 -VsDevShell -MinFreeMB 2048 -WaitMinutes 10 -- @configure
          if ($LASTEXITCODE -ne 0) { throw "configure failed ($LASTEXITCODE)" }

      # 目标：Standalone、VST3 与所有已注册测试的可执行文件。ARALifecycleContractTests 以前在锁定的 ARA SDK 2.3.0 下
      # 编不过而被排除，上游 2c01847 起可以编译并通过。测试与目标的对应关系读自生成的
      # CTestTestfile.cmake，解析方式与 gates.ps1 的 Get-TestTargets 相同。
      - name: Build (RelWithDebInfo, --parallel = runner cores)
        id: build
        run: |
          function Get-TestTargets([string]$Dir, $Map) {
            $file = Join-Path $Dir 'CTestTestfile.cmake'
            if (-not (Test-Path -LiteralPath $file)) { return }
            $text = Get-Content -LiteralPath $file -Raw
            foreach ($m in [regex]::Matches($text, 'add_test\(\s*(?:\[=\[([^\]]+)\]=\]|([^\s"]+))\s+"([^"]+)"')) {
              $name = if ($m.Groups[1].Success) { $m.Groups[1].Value } else { $m.Groups[2].Value }
              if (-not $Map.Contains($name)) { $Map[$name] = [System.IO.Path]::GetFileNameWithoutExtension($m.Groups[3].Value) }
            }
            foreach ($m in [regex]::Matches($text, 'subdirs\(\s*"([^"]+)"\s*\)')) {
              $sub = $m.Groups[1].Value
              Get-TestTargets $(if ([System.IO.Path]::IsPathRooted($sub)) { $sub } else { Join-Path $Dir $sub }) $Map
            }
          }
          $targets = [System.Collections.Generic.List[string]]::new()
          if ($env:OT_PACKAGE -eq 'true') {
            # 出包模式：只构建 Standalone（不含 VST3 与测试）。
            $targets.Add('OpenTuneStandalone_Standalone')
          } else {
            $tests = [ordered]@{}
            Get-TestTargets $env:OT_BUILD $tests
            if ($tests.Count -eq 0) { throw 'no tests registered in CTestTestfile.cmake (OPENTUNE_BUILD_TESTS=ON?)' }
            foreach ($t in @('OpenTuneStandalone_Standalone', 'OpenTune_VST3')) { $targets.Add($t) }
            foreach ($name in @($tests.Keys)) {
              $exe = [string]$tests[$name]
              if ($exe -and -not $targets.Contains($exe)) { $targets.Add($exe) }
            }
          }
          $jobs = [Environment]::ProcessorCount
          Write-Host "targets ($($targets.Count)): $($targets -join ', '); --parallel $jobs"
          $build = @('cmake', '--build', $env:OT_BUILD, '--config', $env:OT_CONFIG, '--parallel', "$jobs", '--target') + $targets
          ConvertTo-Json -Compress -InputObject @($build | ForEach-Object { ([string]$_).Replace($env:OT_BUILD, '<build>') }) |
            Set-Content -LiteralPath "$env:RUNNER_TEMP\ot-cmd-build.json" -Encoding utf8
          pwsh -NoProfile -File .github/scripts/with-build-slot.ps1 -VsDevShell -MinFreeMB 2048 -WaitMinutes 10 -- @build
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }

      # 与 `ctest -C RelWithDebInfo --output-on-failure` 等价，但每个测试有独立的
      # OPENTUNE_DATA_DIR（run-ctest.ps1，与本地 gates 同一份脚本）。失败测试的输出打印到日志。
      - name: ctest (all tests, per-test OPENTUNE_DATA_DIR)
        id: ctest
        if: env.OT_PACKAGE != 'true'
        run: |
          $summary = "$env:RUNNER_TEMP\ot-ctest-summary.json"
          pwsh -NoProfile -File .github/scripts/with-build-slot.ps1 -VsDevShell -MinFreeMB 1024 -WaitMinutes 10 -- `
            pwsh -NoProfile -File .github/scripts/run-ctest.ps1 -BuildDir $env:OT_BUILD -Config $env:OT_CONFIG `
            -DataRoot $env:OT_TEST_DATA -SummaryPath $summary
          $code = $LASTEXITCODE
          if (Test-Path -LiteralPath $summary) {
            $s = Get-Content -LiteralPath $summary -Raw | ConvertFrom-Json
            $lines = @("### ctest（control-api $env:MATRIX_CONTROL_API）", '', "$($s.passed)/$($s.total) 通过；排除 $(@($s.excluded) -join '、')；$($s.seconds) s", '', '| 测试 | 结果 | 秒 |', '|---|---|---|')
            foreach ($t in @($s.tests)) { $lines += "| $($t.name) | $(if ($t.passed) { 'PASS' } else { 'FAIL' }) | $($t.seconds) |" }
            $lines -join "`n" >> $env:GITHUB_STEP_SUMMARY
            foreach ($name in @($s.failed)) {
              Write-Host "::group::$name output"
              Get-Content -LiteralPath (Join-Path $env:OT_TEST_DATA "$name.log") -ErrorAction SilentlyContinue | Write-Host
              Write-Host '::endgroup::'
            }
          }
          if ($code -ne 0) { throw "ctest failed ($code)" }
        env:
          MATRIX_CONTROL_API: ${{ matrix.control-api }}

      # 上游 POST_BUILD 在产物旁边生成的 models\（LFS 指针 + 0 字节声码器占位）会遮住官方安装的模型：
      # 删除它，并断言 build 输出里已不存在任何 models\。
      - name: Remove POST_BUILD models\ and assert it is gone
        id: models
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          function Find-ModelDirs { @(Get-ChildItem -LiteralPath $env:OT_BUILD -Directory -Recurse -Force -Filter 'models' -ErrorAction SilentlyContinue | Where-Object { $_.Name -ieq 'models' }) }
          $found = Find-ModelDirs
          foreach ($d in $found) {
            Remove-Item -LiteralPath $d.FullName -Recurse -Force
            Write-Host "removed $($d.FullName)"
          }
          $left = Find-ModelDirs
          if ($left.Count) { throw "models\ still present: $(($left | ForEach-Object FullName) -join '; ')" }
          Write-Host "removed $($found.Count) models\ director$(if ($found.Count -eq 1) { 'y' } else { 'ies' }); none left"

      # 出包模式：按产物实际内容生成 THIRD-PARTY-NOTICES.txt 与 build-info.json（链接了哪些组件、ARA 是否被链接、
      # D3D12Core.dll 的 sha256 与实际执行的构建命令）。D3D12 运行库本身绝不进入 artifact。
      - name: Generate THIRD-PARTY-NOTICES and build info (release package)
        id: notices
        if: ${{ !cancelled() && env.OT_PACKAGE == 'true' && steps.build.outcome == 'success' && steps.models.outcome == 'success' }}
        run: |
          $out = "$env:RUNNER_TEMP\ot-release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $voc = 'pc_nsf_hifigan_44.1k_ONNX\pc_nsf_hifigan_44.1k_hop512_128bin_2025.02.onnx'
          $fcpe = 'models\fcpe.onnx'
          $commands = @(
            @{ step = 'Fetch the pinned dependencies (sha256 verified; never any model weights) and apply the JUCE patches of scripts/github_actions/patch-juce-ara.py'; argv = @('pwsh', '-NoProfile', '-File', '.github/scripts/bootstrap-deps.ps1', '-DepsRoot', '<deps>', '-LinkInto', '<src>', '-PatchJuce') },
            @{ step = 'Empty placeholder for the vocoder file that the POST_BUILD step copies (no model is downloaded)'; argv = @('New-Item', '-ItemType', 'File', '-Force', "<src>\$voc") },
            @{ step = 'Empty placeholder for the FCPE file that the POST_BUILD step copies (no model is downloaded)'; argv = @('New-Item', '-ItemType', 'File', '-Force', "<src>\$fcpe") },
            @{ step = 'Configure (Visual Studio 2022 x64 developer PowerShell)'; argv = @(Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\ot-cmd-configure.json" | ConvertFrom-Json) },
            @{ step = 'Build'; argv = @(Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\ot-cmd-build.json" | ConvertFrom-Json) },
            @{ step = 'Delete the models folder created by the POST_BUILD step (placeholders that would hide the official models)'; argv = @('Remove-Item', '-Recurse', '-Force', "<build>\OpenTuneStandalone_artefacts\$env:OT_CONFIG\Standalone\models") },
            @{ step = 'Third-party notices and build information'; argv = @('node', '.github/scripts/release-notices.mjs', '--build', '<build>', '--deps', '<deps>', '--config', $env:OT_CONFIG, '--out-notices', 'THIRD-PARTY-NOTICES.txt', '--out-info', 'build-info.json') }
          )
          ConvertTo-Json -Depth 5 -InputObject $commands | Set-Content -LiteralPath "$out\commands.json" -Encoding utf8
          $notices = @(
            '.github/scripts/release-notices.mjs', '--build', $env:OT_BUILD, '--deps', $env:OT_DEPS, '--config', $env:OT_CONFIG,
            '--commands', "$out\commands.json", '--out-notices', "$out\THIRD-PARTY-NOTICES.txt", '--out-info', "$out\build-info.json"
          )
          node @notices
          if ($LASTEXITCODE -ne 0) { throw "release-notices failed ($LASTEXITCODE)" }

      # 产物按白名单暂存，然后递归、大小写不敏感地扫描暂存目录：出现 *.onnx、models\、LFS 指针、D3D12\、D3D12*.dll
      # 或 d3dconfig.exe 即失败。
      #   平时：OpenTune.exe、ORT DLL、DirectML.dll 与两者的 LICENSE、测试日志。
      #   出包模式：打包输入（app\ 下的三个二进制、DirectML 许可、THIRD-PARTY-NOTICES.txt、build-info.json）。
      - name: Stage artifacts (allow-list) and scan them
        id: stage
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.models.outcome == 'success' && (env.OT_PACKAGE != 'true' || steps.notices.outcome == 'success') }}
        run: |
          $app = Join-Path $env:OT_BUILD "OpenTuneStandalone_artefacts\$env:OT_CONFIG\Standalone"
          if (Test-Path -LiteralPath $env:OT_STAGE) { Remove-Item -LiteralPath $env:OT_STAGE -Recurse -Force }
          if ($env:OT_PACKAGE -eq 'true') {
            New-Item -ItemType Directory -Force -Path "$env:OT_STAGE\app", "$env:OT_STAGE\licenses" | Out-Null
            $rel = "$env:RUNNER_TEMP\ot-release"
            $info = Get-Content -Raw -LiteralPath "$rel\build-info.json" | ConvertFrom-Json
            $allow = @(
              @((Join-Path $app 'OpenTune.exe'), 'app\OpenTune.exe'),
              @((Join-Path $app $info.ortDll), "app\$($info.ortDll)"),
              @((Join-Path $app 'DirectML.dll'), 'app\DirectML.dll'),
              @((Join-Path $env:OT_DEPS "microsoft.ai.directml.$($info.directmlVersion)\LICENSE.txt"), 'licenses\DirectML-LICENSE.txt'),
              @("$rel\THIRD-PARTY-NOTICES.txt", 'THIRD-PARTY-NOTICES.txt'),
              @("$rel\build-info.json", 'build-info.json')
            )
          } else {
            New-Item -ItemType Directory -Force -Path "$env:OT_STAGE\app", "$env:OT_STAGE\test-logs" | Out-Null
            $allow = @(
              @((Join-Path $app 'OpenTune.exe'), 'app\OpenTune.exe'),
              @((Join-Path $app 'OpenTuneOnnxRuntime_1_24_4.dll'), 'app\OpenTuneOnnxRuntime_1_24_4.dll'),
              @((Join-Path $app 'DirectML.dll'), 'app\DirectML.dll'),
              @((Join-Path $env:OT_DEPS 'microsoft.ai.directml.1.15.4\LICENSE.txt'), 'app\DirectML-LICENSE.txt'),
              @((Join-Path $env:OT_DEPS 'onnxruntime-dml-1.24.4\LICENSE'), 'app\onnxruntime-LICENSE.txt')
            )
          }
          foreach ($pair in $allow) {
            if (-not (Test-Path -LiteralPath $pair[0] -PathType Leaf)) { throw "allow-listed file missing: $($pair[0])" }
            Copy-Item -LiteralPath $pair[0] -Destination (Join-Path $env:OT_STAGE $pair[1])
          }
          if ($env:OT_PACKAGE -ne 'true' -and (Test-Path -LiteralPath $env:OT_TEST_DATA)) {
            Get-ChildItem -LiteralPath $env:OT_TEST_DATA -File -Filter '*.log' | Copy-Item -Destination "$env:OT_STAGE\test-logs"
          }
          $summary = "$env:RUNNER_TEMP\ot-ctest-summary.json"
          if ($env:OT_PACKAGE -ne 'true' -and (Test-Path -LiteralPath $summary)) { Copy-Item -LiteralPath $summary -Destination "$env:OT_STAGE\test-logs\ctest-summary.json" }

          $problems = @()
          foreach ($i in @(Get-ChildItem -LiteralPath $env:OT_STAGE -Recurse -Force)) {
            $rel = $i.FullName.Substring($env:OT_STAGE.Length).TrimStart('\')
            if ($i.PSIsContainer) {
              if ($i.Name -ieq 'models' -or $i.Name -ieq 'D3D12') { $problems += "forbidden directory: $rel" }
              continue
            }
            if ($i.Name -like '*.onnx' -or $i.Name -like 'D3D12*.dll' -or $i.Name -ieq 'd3dconfig.exe') { $problems += "forbidden file: $rel" }
            if ($i.Length -le 1024) {
              $head = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($i.FullName))
              if ($head.StartsWith('version https://git-lfs.github.com/spec/')) { $problems += "LFS pointer: $rel" }
            }
          }
          if ($problems.Count) { throw "artifact scan failed: $($problems -join '; ')" }
          Write-Host "staged and scanned $(@(Get-ChildItem -LiteralPath $env:OT_STAGE -Recurse -File).Count) files; no models, LFS pointers or D3D12 runtime"
      - name: Upload artifacts (3 days)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.OT_PACKAGE == 'true' && 'opentune-windows-release-inputs' || format('opentune-windows-rwdi-control-api-{0}', matrix.control-api) }}
          path: ${{ env.OT_STAGE }}
          if-no-files-found: error
          retention-days: 3

      - name: sccache statistics
        if: ${{ always() && steps.sccache.outputs.path != '' }}
        env:
          SCCACHE: ${{ steps.sccache.outputs.path }}
        run: |
          & $env:SCCACHE --show-stats
          & $env:SCCACHE --stop-server
          exit 0
      # 只在 push（dev、feature/control-api）时保存：PR 只恢复，避免每次运行新增最多 2G 而挤掉依赖缓存
      # （仓库缓存上限 10 GB，LRU 淘汰）。
      - name: Save sccache cache
        if: ${{ always() && github.event_name == 'push' && steps.sccache.outputs.path != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ot-sccache-windows-rwdi-${{ matrix.control-api }}-${{ github.sha }}

  # 稳定的检查上下文：detect-native 判定不需要编译时给出跳过的成功结果；否则每个 compile-test 都必须成功。
  build-windows:
    name: build-windows
    if: always()
    needs: [detect-native, compile-test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: compile-test must succeed unless detect-native skipped it
        env:
          DETECT: ${{ needs.detect-native.result }}
          BUILD: ${{ needs.detect-native.outputs.build }}
          REASON: ${{ needs.detect-native.outputs.reason }}
          COMPILE: ${{ needs.compile-test.result }}
        run: |
          echo "detect-native: $DETECT (build=$BUILD)"
          echo "reason: $REASON"
          echo "compile-test: $COMPILE"
          if [ "$DETECT" != "success" ]; then
            echo "::error::detect-native $DETECT"
            exit 1
          fi
          if [ "$BUILD" != "true" ]; then
            printf '### build-windows：跳过编译（成功）\n\n%s\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$COMPILE" != "success" ]; then
            echo "::error::compile-test $COMPILE"
            exit 1
          fi
          printf '### build-windows：编译与测试通过\n\n%s\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"
