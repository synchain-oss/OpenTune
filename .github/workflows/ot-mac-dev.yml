#
# TEMPORARY development aid (removed before the pull request): repackages the build inputs of an earlier
# prerelease run and runs the macOS smoke test on the result, without building OpenTune again.
name: ot-mac-dev

on:
  push:
    branches: [feat/B-mac-package]
    paths:
      - '.github/workflows/ot-mac-dev.yml'
      - '.github/workflows/smoke-macos.yml'
      - '.github/scripts/**'
      - '.github/release/**'
      - '.github/e2e/**'

permissions:
  contents: read

env:
  # Run whose artifact `opentune-macos-release-inputs` is repackaged.
  INPUTS_RUN_ID: '41020228611'

jobs:
  package:
    name: package (from an earlier run)
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      name: ${{ steps.pkg.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Fetch the upstream mirror and snapshot tags
        run: >-
          git fetch --no-tags --force origin
          '+refs/heads/upstream-mirror:refs/remotes/origin/upstream-mirror'
          '+refs/tags/upstream/*:refs/tags/upstream/*'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opentune-macos-release-inputs
          path: ${{ runner.temp }}/ot-inputs
          run-id: ${{ env.INPUTS_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          label="rehearsal-$(git rev-parse --short=7 HEAD)"
          up_tag=$(git describe --tags --match 'upstream/*' --abbrev=0 HEAD)
          up_commit=$(git rev-parse "$up_tag^{commit}")
          git diff --no-renames --name-status "$up_commit" HEAD > "$RUNNER_TEMP/ot-name-status.txt"
          node .github/scripts/release-macos.mjs build --inputs "$RUNNER_TEMP/ot-inputs" --out "$RUNNER_TEMP/ot-out" --label "$label" \
            --commit "$head" --date "$(git show -s --format=%cI HEAD)" --repository "$GITHUB_REPOSITORY" --server-url "$GITHUB_SERVER_URL" \
            --name-status "$RUNNER_TEMP/ot-name-status.txt" --upstream-tag "$up_tag" --upstream-commit "$up_commit" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --smoke "development run"
          zip=$(ls "$RUNNER_TEMP"/ot-out/*.zip)
          name=$(basename "$zip" .zip)
          node .github/scripts/release-package.mjs verify --zip "$zip" --name "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/ot-out"
      - name: List the package folder (on failure)
        if: failure()
        run: |
          ls -la "$RUNNER_TEMP/ot-out" || true
          find "$RUNNER_TEMP/ot-out" -maxdepth 6 -print 2>/dev/null | head -200 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ot-dev-package-macos
          path: |
            ${{ runner.temp }}/ot-out/*.zip
            ${{ runner.temp }}/ot-out/release-body-macos.md
            ${{ runner.temp }}/ot-out/manifest-macos.json
          if-no-files-found: error
          retention-days: 3

  smoke-macos:
    if: ${{ false }}
    needs: package
    uses: ./.github/workflows/smoke-macos.yml
    with:
      package-artifact: ot-dev-package-macos
      package-name: ${{ needs.package.outputs.name }}

  diag:
    name: diag (launcher under a pseudo terminal)
    needs: package
    runs-on: macos-14
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ot-dev-package-macos
          path: ${{ runner.temp }}/pkg
      - name: Extract
        run: |
          mkdir -p "$RUNNER_TEMP/x"
          ditto -x -k "$RUNNER_TEMP"/pkg/*.zip "$RUNNER_TEMP/x"
          ls "$RUNNER_TEMP/x"
      - name: Check out the MCP repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: synchain-oss/opentune-mcp-server
          ref: feature/v1
          path: ot-mcp
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: npm ci and build
        working-directory: ot-mcp
        run: npm ci --no-audit --no-fund && npm run build
      - name: E1. script with an open pipe as input
        run: |
          set +e; set -u
          dir=$(ls -d "$RUNNER_TEMP"/x/OpenTune-*)
          (sleep 4) | script -q /dev/null /bin/sh -c 'echo hello; tty; if [ -t 1 ]; then echo stdout-is-tty; fi'
          echo "E1 rc=$?"
          (sleep 4) | script -q /dev/null "$dir/OpenTune-AI.command" --version
          echo "E1b rc=$?"
          pkill -x OpenTune || true
      - name: E2. python pty.fork runs the launcher
        run: |
          set +e; set -u
          dir=$(ls -d "$RUNNER_TEMP"/x/OpenTune-*)
          d="$RUNNER_TEMP/dE2"; mkdir -p "$d"
          which python3; python3 --version
          cat > "$RUNNER_TEMP/ptyrun.py" <<'PY'
          import os, pty, sys, time
          pid, fd = pty.fork()
          if pid == 0:
              os.execv(sys.argv[1], sys.argv[1:])
          out = b''
          try:
              while True:
                  chunk = os.read(fd, 4096)
                  if not chunk:
                      break
                  out += chunk
          except OSError:
              pass
          _, status = os.waitpid(pid, 0)
          print('child exit status', os.waitstatus_to_exitcode(status))
          print('output', out[:300])
          PY
          sed -i '' 's/^          //' "$RUNNER_TEMP/ptyrun.py"
          OPENTUNE_DATA_DIR="$d" python3 "$RUNNER_TEMP/ptyrun.py" "$dir/OpenTune-AI.command" --control-api-ready-file="$d/ready.json"
          echo "E2 rc=$?"
          for n in 1 2 3; do sleep 3; ps -ax -o pid,ppid,pgid,stat,command | grep -i "[O]penTune-ctl" || echo "E2: no OpenTune process after $((n*3)) s"; done
          ls -R "$d" | head -12
          pkill -x OpenTune || true
      - name: E3. expect runs the launcher
        run: |
          set +e; set -u
          dir=$(ls -d "$RUNNER_TEMP"/x/OpenTune-*)
          d="$RUNNER_TEMP/dE3"; mkdir -p "$d"
          which expect
          OPENTUNE_DATA_DIR="$d" expect -c 'set timeout 20; spawn -noecho {*}$argv; expect eof; catch wait result; puts "exit [lindex $result 3]"' "$dir/OpenTune-AI.command" --control-api-ready-file="$d/ready.json"
          echo "E3 rc=$?"
          for n in 1 2 3; do sleep 3; ps -ax -o pid,ppid,pgid,stat,command | grep -i "[O]penTune-ctl" || echo "E3: no OpenTune process after $((n*3)) s"; done
          ls -R "$d" | head -12
          pkill -x OpenTune || true
