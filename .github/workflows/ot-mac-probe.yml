# SPDX-License-Identifier: AGPL-3.0-or-later
# Temporary probe (removed before the pull request): how the MCP server starts OpenTune and adopts the instance.
name: ot-mac-probe

on:
  push:
    branches: ['feat/B-mac-package']
    paths:
      - '.github/workflows/ot-mac-probe.yml'

permissions:
  contents: read

jobs:
  mcp-source:
    name: mcp-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the MCP repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: synchain-oss/opentune-mcp-server
          ref: feature/v1
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Launch sources
        run: |
          ls -la src/launch
          echo "=== config.ts"
          sed -n 1,120p src/launch/config.ts
      - name: Spawn and pid handling
        run: |
          grep -n "spawn\|pid\|detached\|execFile\|workingDirectory\|executable_folder\|official_install\|cwd" src/launch/*.ts | head -150
