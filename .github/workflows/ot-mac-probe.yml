# SPDX-License-Identifier: AGPL-3.0-or-later
# Temporary probe (removed before the pull request): where the MCP server looks for opentune-control.json
# and how it starts OpenTune on macOS.
name: ot-mac-probe

on:
  push:
    branches: ['feat/B-mac-package']
    paths:
      - '.github/workflows/ot-mac-probe.yml'

permissions:
  contents: read

jobs:
  mcp-source:
    name: mcp-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the MCP repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: synchain-oss/opentune-mcp-server
          ref: feature/v1
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Where the manifest is read
        run: |
          git log -1 --format='%H %s'
          grep -rn -i "opentune-control" --include=*.ts --include=*.md --include=*.json . 2>/dev/null | grep -v node_modules | head -80
      - name: The manifest reader
        run: |
          f=$(grep -rl -i "CONTROL_JSON_MAX\|opentune-control.json" src | head -5)
          echo "files: $f"
          for x in $f; do echo "=== $x"; wc -l "$x"; done
      - name: Darwin handling in launch and doctor
        run: |
          grep -rn -i "darwin\|macos\|\.app\b\|Contents/MacOS\|\.command" src | head -80
