#
# fork 专用（L0）：上游 .gitignore 忽略 `.*/`，本文件以 git add -f 入库，永不进入上游 PR。
name: Prerelease

# 非官方 Windows x64 测试版（zip）的出包流水线。说明见 .github/release/README.md。
#   push tag synchain-test/*   正式出包：校验 tag → 构建 → 打包与校验 → side-car 冒烟 → 创建「草稿」预发布。
#                              side-car 冒烟任一矩阵项失败就不建草稿。草稿只有维护者手动发布；本 workflow 从不发布、从不推 tag。
#   workflow_dispatch          演练：构建 + 打包 + 白名单与 SHA256SUMS 校验 + side-car 冒烟 + 短保留期 artifact，不建 release。
#   pull_request（改到打包相关路径）  同上，演练。
# 校验 tag（只在 tag 触发时）：名字是 synchain-test/v<x.y.z>-ctl.<n>、x.y.z 等于 CMakeLists.txt 的 VERSION、
# 提交是 dev 的祖先、该提交上由 GitHub Actions 创建的 fork-gate 为绿（其他 App 建的同名 check run 不算）。
# 构建经 workflow_call 调 build-windows.yml 的出包模式：Standalone、Release（LTCG）、控制接口 ON，
# 删除 POST_BUILD 生成的 models\ 并断言不存在，按产物实际内容生成 THIRD-PARTY-NOTICES.txt。
# 打包（release-package.mjs）：严格白名单，多一个文件、或出现 *.onnx、models/、LFS 指针、D3D12*、d3dconfig.exe、
# STATEMENTS.txt（递归、大小写不敏感）即失败；生成 SHA256SUMS 并在 zip 里复核；发布正文过署名检查。
# 任何 workflow 一律不用 pull_request 的 target 变体（CLAUDE.md §0 第 4 条）；默认只读权限，只有创建草稿的 job
# 有 contents: write。
on:
  push:
    tags: ['synchain-test/*']
  workflow_dispatch:
  pull_request:
    branches: [dev, 'feature/**']
    # 打包脚本及其 import / 读取的文件，出包模式构建用到的脚本，以及 side-car 冒烟的脚本与钉版文件：只改其中任何一个也要演练。
    paths:
      - '.github/workflows/prerelease.yml'
      - '.github/workflows/build-windows.yml'
      - '.github/release/**'
      - '.github/scripts/release-*.mjs'
      - '.github/scripts/test/release-lib.test.mjs'
      - '.github/scripts/sidecar-smoke.mjs'
      - '.github/scripts/test/sidecar-smoke.test.mjs'
      - '.github/scripts/e2e-windows.mjs'
      - '.github/e2e/official-install.json'
      - '.github/scripts/fork-lib.mjs'
      - '.github/scripts/check-attribution.mjs'
      - '.github/scripts/attribution-patterns.txt'
      - '.github/scripts/detect-native.mjs'
      - '.github/scripts/fork-delta.mjs'
      - '.github/scripts/with-build-slot.ps1'
      - '.github/scripts/bootstrap-deps.ps1'
      - '.github/scripts/deps.lock.json'

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.event.pull_request.number || github.ref }}
  # tag 触发的正式出包不被后来的运行取消。
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      mode: ${{ steps.v.outputs.mode }}
      version: ${{ steps.v.outputs.version }}
      label: ${{ steps.v.outputs.label }}
      tag: ${{ steps.v.outputs.tag }}
      name: ${{ steps.v.outputs.name }}
    steps:
      # lfs: false —— 绝不下载模型权重（CLAUDE.md §11）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Fetch dev
        run: git fetch --no-tags --force origin '+refs/heads/dev:refs/remotes/origin/dev'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: fork-gate check runs of the tagged commit (tag builds only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: gh api "repos/$REPO/commits/$SHA/check-runs?check_name=fork-gate&per_page=100" > "$RUNNER_TEMP/fork-gate-checks.json"
      # tag 名是不可信文本：只经 env 传给脚本，脚本只拿它与固定规则比对。
      - name: Validate (tag rules, version, on dev, fork-gate)
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(validate --event "$EVENT_NAME" --sha "$SHA" --dev-ref origin/dev --github-output "$GITHUB_OUTPUT")
          if [ "$EVENT_NAME" = push ]; then
            args+=(--tag "$TAG" --checks "$RUNNER_TEMP/fork-gate-checks.json")
          fi
          node .github/scripts/release-package.mjs "${args[@]}"

  build:
    name: build
    needs: validate
    uses: ./.github/workflows/build-windows.yml
    with:
      release-package: true

  package:
    name: package
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      # MODIFICATIONS.md 列出相对锁定上游快照的改动：显式取 upstream-mirror 与 upstream/* tag。
      - name: Fetch the upstream mirror and snapshot tags
        run: >-
          git fetch --no-tags --force origin
          '+refs/heads/upstream-mirror:refs/remotes/origin/upstream-mirror'
          '+refs/tags/upstream/*:refs/tags/upstream/*'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opentune-windows-release-inputs
          path: ${{ runner.temp }}/ot-inputs
      - name: Package (allow-list, SHA256SUMS, zip, release body)
        env:
          LABEL: ${{ needs.validate.outputs.label }}
          TAG: ${{ needs.validate.outputs.tag }}
          NAME: ${{ needs.validate.outputs.name }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 发布正文在 side-car 冒烟之前渲染；带这段正文的草稿只在冒烟的每个矩阵项都通过后才创建，所以凡是存在的草稿这句话都成立。
          SMOKE_TEXT: >-
            passed on GitHub-hosted Windows runners with official OpenTune installed (the versions and install folders
            are listed in the build run below; the draft is only created after the test passed); GPU acceleration was
            not tested (the runners have no GPU)
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          up_tag=$(git describe --tags --match 'upstream/*' --abbrev=0 HEAD)
          up_commit=$(git rev-parse "$up_tag^{commit}")
          git diff --no-renames --name-status "$up_commit" HEAD > "$RUNNER_TEMP/ot-name-status.txt"
          args=(build --inputs "$RUNNER_TEMP/ot-inputs" --out "$RUNNER_TEMP/ot-out" --label "$LABEL"
            --commit "$head" --date "$(git show -s --format=%cI HEAD)" --repository "$REPO" --server-url "$SERVER"
            --name-status "$RUNNER_TEMP/ot-name-status.txt" --upstream-tag "$up_tag" --upstream-commit "$up_commit"
            --run-url "$RUN_URL" --smoke "$SMOKE_TEXT")
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          node .github/scripts/release-package.mjs "${args[@]}"
          node .github/scripts/release-package.mjs verify --zip "$RUNNER_TEMP/ot-out/$NAME.zip" --name "$NAME"
      - name: Upload the package (rehearsal 3 days, tag build 14 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentune-unofficial-${{ needs.validate.outputs.label }}
          path: |
            ${{ runner.temp }}/ot-out/*.zip
            ${{ runner.temp }}/ot-out/release-body.md
            ${{ runner.temp }}/ot-out/manifest.json
          if-no-files-found: error
          retention-days: ${{ needs.validate.outputs.mode == 'release' && 14 || 3 }}

  # side-car 冒烟：验证「测试包解压到已装官方 OpenTune 的机器上就能用」。每个矩阵项一台新的 Windows runner：
  #   1. 按钉版文件（.github/e2e/official-install.json，与 e2e-windows 同一份）下载并核对官方安装包，静默安装到默认目录
  #      或 /DIR= runner 临时目录（官方安装包只在 runner 上运行，绝不在开发机上运行）；记录耗时与实际安装位置；核对模型。
  #   2. 解压本次打出的 zip 到 runner 临时目录（不在 Program Files 下），按 SHA256SUMS 与白名单核对。
  #   3. OpenTune MCP Server 的 doctor --json，以及经 MCP 的 opentune_launch（OPENTUNE_MCP_OPENTUNE_PATH = 解压出的 exe）
  #      启动并导入一段生成的音频：ORT DLL 来自解压目录、modelsDir 是官方安装的模型目录、CPU 推理不崩溃。
  #   4. 按 INSTALL 第 4 步从官方安装复制 D3D12Core.dll：哈希一致、没有 SDKLayers；再跑 doctor 与一次启动
  #      （runner 没有 GPU 时 DirectML 一项记 FLAKY-SKIP）。
  #   5. 对解压出的 exe 跑 MCP 仓库的契约向量与冒烟场景（与 e2e-windows 同样的脚本与首次引导模板），检查日志里的模型目录。
  # 每步的 PASS / FAIL / SKIP / FLAKY-SKIP 与耗时写进 job 摘要与 artifact（上传前脱敏）。doctor 里 MCP 尚未实现的检查记 SKIP；
  # 只有 FAIL 或某组没有结果才使 job 失败。tag 触发时任一矩阵项失败，draft-release 就不运行。
  sidecar-smoke:
    name: sidecar-smoke (${{ matrix.version }}, ${{ matrix.location }} folder)
    needs: [validate, package]
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # 钉版版本，默认安装目录与自定义目录各一次；再加最低支持的官方版本（release.json 的 minOfficialVersion）。
          - { id: 1.8.1-default, version: 1.8.1, location: default }
          - { id: 1.8.1-custom, version: 1.8.1, location: custom }
          - { id: 1.7.9-default, version: 1.7.9, location: default }
    defaults:
      run:
        shell: pwsh
    env:
      MCP_REPOSITORY: synchain-oss/opentune-mcp-server
      MCP_REF: feature/v1
      # 契约向量里针对 exe 的那一组（同 e2e-windows）。
      CONTRACT_FILTER: against the exe
      OT_VERSION: ${{ matrix.version }}
      OT_LOCATION: ${{ matrix.location }}
      PACKAGE_NAME: ${{ needs.validate.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set work paths
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'ot-sc'
          New-Item -ItemType Directory -Force -Path "$work\out\logs", "$work\kept", "$work\data", "$work\template", "$work\side-car", "$work\doctor-data" | Out-Null
          @(
            "SC_WORK=$work"
            "SC_OUT=$work\out"
            "SC_STEPS=$work\out\steps.json"
            "SC_PKG=$work\pkg"
            "SC_SIDECAR=$work\side-car\$env:PACKAGE_NAME"
            "SC_KEEP=$work\kept"
            "SC_TEMPLATE=$work\template"
            "SC_CUSTOM=$work\official"
            "SC_PIN=$env:GITHUB_WORKSPACE\.github\e2e\official-install.json"
            "SC_SCRIPT=$env:GITHUB_WORKSPACE\.github\scripts\sidecar-smoke.mjs"
            "E2E_SCRIPT=$env:GITHUB_WORKSPACE\.github\scripts\e2e-windows.mjs"
          ) >> $env:GITHUB_ENV

      - name: Download the package of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opentune-unofficial-${{ needs.validate.outputs.label }}
          path: ${{ runner.temp }}\ot-sc\pkg

      - name: Download the pinned official installer (sha256 verified)
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $ok = $false
          try {
            $pin = Get-Content -Raw -LiteralPath $env:SC_PIN | ConvertFrom-Json
            $inst = @(@($pin.installer) + @($pin.olderInstallers) | Where-Object { $_ -and $_.version -eq $env:OT_VERSION })
            if ($inst.Count -ne 1) { throw "no pinned installer for OpenTune $env:OT_VERSION in official-install.json" }
            $setup = Join-Path $env:SC_WORK 'OpenTune-Setup.exe'
            for ($i = 1; ; $i++) {
              try { Invoke-WebRequest -Uri $inst[0].url -OutFile $setup -UseBasicParsing; break }
              catch { if ($i -ge 3) { throw }; Start-Sleep -Seconds (5 * $i) }
            }
            node $env:E2E_SCRIPT check-installer --pin $env:SC_PIN --version $env:OT_VERSION --file $setup
            if ($LASTEXITCODE -ne 0) { throw "installer does not match the pin" }
            "SC_SETUP=$setup" >> $env:GITHUB_ENV
            $ok = $true
          } finally {
            node $env:SC_SCRIPT step --steps $env:SC_STEPS --group install --name "下载官方安装包 $env:OT_VERSION，核对 sha256 与大小" `
              --result ($ok ? 'PASS' : 'FAIL') --seconds $sw.Elapsed.TotalSeconds
          }

      # 安装位置取安装程序写下的卸载项（InstallLocation），与期望位置比对：默认目录是 %ProgramFiles%\OpenTune。
      # 模型目录按钉版文件里这个版本的 modelsDir（实测：1.8.1 放在共享的 %ProgramData%\OpenTune\Models，
      # 1.7.9 放在安装目录的 models\），之后的模型核对、启动日志与日志检查都按它比对。
      - name: Install the official OpenTune silently (default folder, or /DIR= a runner temp folder)
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $pin = Get-Content -Raw -LiteralPath $env:SC_PIN | ConvertFrom-Json
          $inst = @(@($pin.installer) + @($pin.olderInstallers) | Where-Object { $_ -and $_.version -eq $env:OT_VERSION })[0]
          $setupArgs = @($inst.silentArgs) + @("/LOG=$env:SC_OUT\official-install.log")
          if ($env:OT_LOCATION -eq 'custom') { $setupArgs += "/DIR=$env:SC_CUSTOM"; $expect = $env:SC_CUSTOM }
          else { $expect = Join-Path $env:ProgramFiles 'OpenTune' }
          $p = Start-Process -FilePath $env:SC_SETUP -ArgumentList $setupArgs -Wait -PassThru
          $seconds = $sw.Elapsed.TotalSeconds
          if ($p.ExitCode -ne 0) {
            node $env:SC_SCRIPT step --steps $env:SC_STEPS --group install --name "安装官方 OpenTune $env:OT_VERSION" --result FAIL --seconds $seconds --note "installer exit code $($p.ExitCode)"
            throw "official installer exited with $($p.ExitCode)"
          }
          $keys = @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*')
          $entry = @(Get-ItemProperty -Path $keys -ErrorAction SilentlyContinue | Where-Object { "$($_.DisplayName)" -like 'OpenTune*' }) | Select-Object -First 1
          $dir = if ($entry -and $entry.InstallLocation) { "$($entry.InstallLocation)".TrimEnd('\') } else { '' }
          Write-Host "uninstall entry: $($entry.PSChildName); DisplayName $($entry.DisplayName); DisplayVersion $($entry.DisplayVersion); InstallLocation $dir"
          $models = node $env:E2E_SCRIPT models-dir --pin $env:SC_PIN --version $env:OT_VERSION "--app=$dir"
          if ($LASTEXITCODE -ne 0) { throw "no models folder for OpenTune $env:OT_VERSION in official-install.json" }
          Write-Host "models folder of this version: $models"
          "SC_OFFICIAL=$dir" >> $env:GITHUB_ENV
          "SC_MODELS=$models" >> $env:GITHUB_ENV
          node $env:SC_SCRIPT install --steps $env:SC_STEPS "--dir=$dir" --expect-dir $expect --models-dir $models `
            --location $env:OT_LOCATION --version $env:OT_VERSION "--registry-version=$($entry.DisplayVersion)" --seconds $seconds `
            --out "$env:SC_OUT\official-install.json"
          if ($LASTEXITCODE -ne 0) { throw "the official installation is not where or what it should be" }
      # 安装程序可能在静默安装后启动官方 OpenTune：结束官方安装目录里的那个进程，并确认真实 %APPDATA%\OpenTune 没被写过
      # （同 e2e-windows）。后面经 MCP 启动时，任何没有发现文件的 OpenTune 进程都会让它报 RUNNING_WITHOUT_API。
      - name: Stop any official OpenTune the installer started
        run: |
          $root = (Resolve-Path -LiteralPath $env:SC_OFFICIAL).Path.TrimEnd('\') + '\'
          $found = @(Get-Process -Name OpenTune -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith($root, [StringComparison]::OrdinalIgnoreCase) })
          Write-Host "official OpenTune processes started by the installer: $($found.Count)"
          $found | Stop-Process -Force -ErrorAction SilentlyContinue
          $found | ForEach-Object { $_.WaitForExit(10000) | Out-Null }
          $real = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'OpenTune'
          if (Test-Path -LiteralPath $real) { throw "the real user data folder exists after the official install (it must stay untouched)" }
      - name: Official models match the pin (fcpe, GAME)
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          node $env:E2E_SCRIPT check-models --pin $env:SC_PIN --dir $env:SC_MODELS
          $code = $LASTEXITCODE
          node $env:SC_SCRIPT step --steps $env:SC_STEPS --group models --name '官方模型与钉版 sha256 一致（fcpe、GAME）' `
            --result ($code -eq 0 ? 'PASS' : 'FAIL') --seconds $sw.Elapsed.TotalSeconds --note $env:SC_MODELS
          if ($code -ne 0) { throw "official models do not match the pin" }

      # INSTALL 第 3 步的校验命令照用户的做法原样运行一次（没有输出即全部一致），再由脚本按 SHA256SUMS 与白名单逐项核对。
      - name: Extract the package outside Program Files and check it (SHA256SUMS, allow-list)
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Expand-Archive -LiteralPath (Join-Path $env:SC_PKG "$env:PACKAGE_NAME.zip") -DestinationPath (Split-Path -Parent $env:SC_SIDECAR)
          Push-Location -LiteralPath $env:SC_SIDECAR
          $documented = @(Get-Content .\SHA256SUMS | ForEach-Object {
            $hash, $name = $_ -split '  ', 2
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $name).Hash -ne $hash) { "MISMATCH: $name" }
          }) -join '; '
          Pop-Location
          node $env:SC_SCRIPT package --steps $env:SC_STEPS --dir $env:SC_SIDECAR "--documented=$documented" --seconds $sw.Elapsed.TotalSeconds
          if ($LASTEXITCODE -ne 0) { throw "the extracted package is not complete or not clean" }

      - name: Check out the MCP repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.MCP_REPOSITORY }}
          ref: ${{ env.MCP_REF }}
          path: ot-mcp
          fetch-depth: 1
          persist-credentials: false
      - name: npm ci and build the MCP bundle
        working-directory: ot-mcp
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed ($LASTEXITCODE)" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed ($LASTEXITCODE)" }
          "SC_MCP=$((Resolve-Path -LiteralPath 'dist\opentune-mcp.mjs').Path)" >> $env:GITHUB_ENV

      # 首次引导模板（同 e2e-windows）：每次启动前复制进这次启动的数据目录，免得首次引导对话框挡住接口的写操作。
      - name: Seed the onboarding-completed preferences template
        run: |
          $xml = @'
          <?xml version="1.0" encoding="UTF-8"?>

          <PROPERTIES>
            <VALUE name="shared.onboardingShown" val="1"/>
          </PROPERTIES>
          '@
          [IO.File]::WriteAllText((Join-Path $env:SC_TEMPLATE 'app-preferences.settings'), (($xml -replace "`r`n", "`n").TrimEnd() + "`n"), [Text.UTF8Encoding]::new($false))

      # doctor 有失败项时退出码为 1：这里不看退出码，由脚本按检查 ID 逐项判定（MCP 尚未实现的检查记 SKIP）。
      - name: doctor before the D3D12 copy
        env:
          OPENTUNE_MCP_OPENTUNE_PATH: ${{ env.SC_SIDECAR }}\OpenTune.exe
          OPENTUNE_DATA_DIR: ${{ env.SC_WORK }}\doctor-data
        run: |
          node $env:SC_MCP doctor --json > "$env:SC_OUT\doctor-no-d3d12.json"
          Write-Host "doctor exit code: $LASTEXITCODE"
          Get-Content -Raw -LiteralPath "$env:SC_OUT\doctor-no-d3d12.json" | Write-Host
          node $env:SC_SCRIPT doctor --steps $env:SC_STEPS --report "$env:SC_OUT\doctor-no-d3d12.json" --phase no-d3d12 --install-dir $env:SC_OFFICIAL --mcp-ref $env:MCP_REF
          if ($LASTEXITCODE -ne 0) { throw "doctor helper failed" }
      # 之后结束本 job 启动的所有 OpenTune（runner 上没有别人的 OpenTune），免得下一次启动把它当成没开接口的实例。
      - name: Launch the side-car through MCP without D3D12 (ORT DLL, modelsDir, CPU inference)
        run: |
          node $env:SC_SCRIPT launch --steps $env:SC_STEPS --phase no-d3d12 --mcp $env:SC_MCP --exe "$env:SC_SIDECAR\OpenTune.exe" `
            --data-dir "$env:SC_WORK\launch-no-d3d12" --template $env:SC_TEMPLATE --official-dir $env:SC_OFFICIAL `
            --models-dir $env:SC_MODELS --out "$env:SC_OUT\launch-no-d3d12.json" --logs-out "$env:SC_OUT\logs\launch-no-d3d12"
          $code = $LASTEXITCODE
          Get-Process -Name OpenTune -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "launch helper failed" }

      # INSTALL 第 4 步，<文件夹> 换成解压目录。INSTALL 写的是默认安装目录；自定义目录的矩阵项用同样的命令、换成它的安装目录。
      - name: Copy D3D12Core.dll once, as INSTALL step 4 says
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $folder = $env:SC_SIDECAR
          try {
            if ($env:OT_LOCATION -eq 'default') { $source = "$env:ProgramFiles\OpenTune\D3D12\D3D12Core.dll" } else { $source = "$env:SC_OFFICIAL\D3D12\D3D12Core.dll" }
            New-Item -ItemType Directory -Force -Path "$folder\D3D12" | Out-Null
            Copy-Item -LiteralPath $source -Destination "$folder\D3D12\D3D12Core.dll"
            (Get-FileHash -Algorithm SHA256 -LiteralPath "$folder\D3D12\D3D12Core.dll").Hash
          } catch {
            node $env:SC_SCRIPT step --steps $env:SC_STEPS --group d3d12 --name 'INSTALL 第 4 步的复制命令' --result FAIL --note "$_"
          }
          node $env:SC_SCRIPT d3d12 --steps $env:SC_STEPS --official-dir $env:SC_OFFICIAL --sidecar $folder --seconds $sw.Elapsed.TotalSeconds
          if ($LASTEXITCODE -ne 0) { throw "d3d12 helper failed" }
      - name: doctor after the D3D12 copy
        env:
          OPENTUNE_MCP_OPENTUNE_PATH: ${{ env.SC_SIDECAR }}\OpenTune.exe
          OPENTUNE_DATA_DIR: ${{ env.SC_WORK }}\doctor-data
        run: |
          node $env:SC_MCP doctor --json > "$env:SC_OUT\doctor-d3d12.json"
          Write-Host "doctor exit code: $LASTEXITCODE"
          node $env:SC_SCRIPT doctor --steps $env:SC_STEPS --report "$env:SC_OUT\doctor-d3d12.json" --phase d3d12 --install-dir $env:SC_OFFICIAL --mcp-ref $env:MCP_REF
          if ($LASTEXITCODE -ne 0) { throw "doctor helper failed" }
      - name: Launch the side-car through MCP with D3D12 (DirectML is FLAKY-SKIP without a GPU)
        run: |
          node $env:SC_SCRIPT launch --steps $env:SC_STEPS --phase d3d12 --mcp $env:SC_MCP --exe "$env:SC_SIDECAR\OpenTune.exe" `
            --data-dir "$env:SC_WORK\launch-d3d12" --template $env:SC_TEMPLATE --official-dir $env:SC_OFFICIAL `
            --models-dir $env:SC_MODELS --out "$env:SC_OUT\launch-d3d12.json" --logs-out "$env:SC_OUT\logs\launch-d3d12"
          $code = $LASTEXITCODE
          Get-Process -Name OpenTune -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "launch helper failed" }

      # 契约与冒烟各自 continue-on-error，结果由最后的汇总统一判定（同 e2e-windows）。
      - name: Contract vectors against the side-car
        id: contract
        continue-on-error: true
        timeout-minutes: 20
        working-directory: ot-mcp
        env:
          OTCP_TARGET_EXE: ${{ env.SC_SIDECAR }}\OpenTune.exe
          OPENTUNE_DATA_DIR: ${{ env.SC_WORK }}\data
          OTCP_TARGET_DATA_DIR: ${{ env.SC_KEEP }}
          OTCP_TARGET_DATA_TEMPLATE: ${{ env.SC_TEMPLATE }}
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          try {
            npm run test:contract -- --reporter=default --reporter=json "--outputFile.json=$env:SC_OUT\contract.json" -t $env:CONTRACT_FILTER
            if ($LASTEXITCODE -ne 0) { throw "contract vectors failed ($LASTEXITCODE)" }
          } finally {
            "SC_CONTRACT_SECONDS=$($sw.Elapsed.TotalSeconds)" >> $env:GITHUB_ENV
          }
      - name: Smoke scenario against the side-car (hello, import, F0 ready, AUTO, export)
        id: smoke
        continue-on-error: true
        timeout-minutes: 20
        working-directory: ot-mcp
        env:
          OTCP_TARGET_EXE: ${{ env.SC_SIDECAR }}\OpenTune.exe
          OPENTUNE_DATA_DIR: ${{ env.SC_WORK }}\data
          OTCP_TARGET_DATA_DIR: ${{ env.SC_KEEP }}
          OTCP_TARGET_DATA_TEMPLATE: ${{ env.SC_TEMPLATE }}
          OTCP_E2E_REPORT: ${{ env.SC_OUT }}\smoke.json
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          try {
            npm run e2e:exe -- test/e2e/exe-smoke.test.ts
            if ($LASTEXITCODE -ne 0) { throw "smoke scenario failed ($LASTEXITCODE)" }
          } finally {
            "SC_SMOKE_SECONDS=$($sw.Elapsed.TotalSeconds)" >> $env:GITHUB_ENV
          }
      - name: Check the OpenTune logs of the contract and smoke runs (models folder, backend) and scrub them
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          Get-Process -Name OpenTune -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          node $env:E2E_SCRIPT check-log --data-root $env:SC_KEEP --models-dir $env:SC_MODELS `
            --out-dir "$env:SC_OUT\logs\contract-smoke" --report "$env:SC_OUT\log-report.json"
          if ($LASTEXITCODE -ne 0) { throw "log check failed" }

      - name: Summary (PASS / FAIL / SKIP / FLAKY-SKIP and time of every step)
        if: ${{ !cancelled() }}
        env:
          # The two runner steps are continue-on-error: their outcome, not only their JSON report, decides the result.
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          node $env:SC_SCRIPT results --steps $env:SC_STEPS --contract "$env:SC_OUT\contract.json" --smoke "$env:SC_OUT\smoke.json" `
            --log "$env:SC_OUT\log-report.json" "--contract-outcome=$env:CONTRACT_OUTCOME" "--smoke-outcome=$env:SMOKE_OUTCOME" "--contract-seconds=$env:SC_CONTRACT_SECONDS" "--smoke-seconds=$env:SC_SMOKE_SECONDS"
          $where = if ($env:OT_LOCATION -eq 'custom') { '自定义安装目录' } else { '默认安装目录' }
          node $env:SC_SCRIPT summary --steps $env:SC_STEPS --title "side-car 冒烟：官方 OpenTune $env:OT_VERSION，$where" `
            --package "$env:PACKAGE_NAME.zip" --mcp-ref $env:MCP_REF --out $env:GITHUB_STEP_SUMMARY --json "$env:SC_OUT\sidecar-report.json"
          $code = $LASTEXITCODE
          Copy-Item -LiteralPath $env:GITHUB_STEP_SUMMARY -Destination "$env:SC_OUT\summary.md" -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "the side-car smoke test has failing or missing results" }

      # 上传前对整个输出目录（步骤表、doctor 与启动报告、契约与冒烟报告、日志、安装日志）再脱敏一遍。
      - name: Scrub every file that will be uploaded
        if: ${{ !cancelled() }}
        run: node $env:E2E_SCRIPT scrub --dir $env:SC_OUT
      - name: Upload the results (steps, doctor and launch reports, scrubbed logs)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidecar-smoke-${{ matrix.id }}
          path: ${{ env.SC_OUT }}
          if-no-files-found: warn
          retention-days: 14

  # 只有 push synchain-test/* tag 才创建草稿预发布；草稿的发布（转正）由维护者手动进行。
  draft-release:
    name: draft-release
    needs: [validate, package, sidecar-smoke]
    if: needs.validate.outputs.mode == 'release' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/synchain-test/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opentune-unofficial-${{ needs.validate.outputs.label }}
          path: ${{ runner.temp }}/ot-out
      - name: Re-check the zip and the release body
        env:
          NAME: ${{ needs.validate.outputs.name }}
        run: |
          set -euo pipefail
          node .github/scripts/release-package.mjs verify --zip "$RUNNER_TEMP/ot-out/$NAME.zip" --name "$NAME"
          node .github/scripts/check-attribution.mjs "$RUNNER_TEMP/ot-out/release-body.md"
      - name: Create the draft pre-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenTune ${{ needs.validate.outputs.version }} ${{ needs.validate.outputs.label }} - unofficial test build / 非官方测试版
          body_path: ${{ runner.temp }}/ot-out/release-body.md
          draft: true
          prerelease: true
          make_latest: 'false'
          files: ${{ runner.temp }}/ot-out/${{ needs.validate.outputs.name }}.zip
          fail_on_unmatched_files: true
          overwrite_files: false
